# Tailnet Atlas — a live map of who can reach what in your tailnet(s).
#
# Copy to compose.yml (which is gitignored) and add one config mount per tailnet.
#
# The app never listens on a public interface: it binds 127.0.0.1 inside the
# Tailscale sidecar's network namespace, and the only way in is `tailscale
# serve` (see serve.json — Funnel is explicitly off). Reachable at
# https://<TS_HOSTNAME>.<your-tailnet>.ts.net once the node is up.
#
# One sidecar, one app, one URL: the sidecar only joins the ONE tailnet you
# serve the page from. Every tailnet the app can SHOW (see tailnets.toml) is
# read over the plain Tailscale API via its own OAuth client — no extra
# sidecar or node needed per tailnet. Do NOT mount the same ./data/tailscale
# directory into a second tailscale container: two daemons sharing one state
# directory become the same node and fight over its identity.
services:
  ts-tailnet:
    image: tailscale/tailscale:latest
    container_name: tailnet-tailscale
    hostname: ${TS_HOSTNAME:?set TS_HOSTNAME in .env}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:?set TS_HOSTNAME in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      # log in only if the persisted state isn't already logged in, so a
      # restart or rebuild reuses this node instead of registering a new one
      TS_AUTH_ONCE: "true"
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [net_admin, sys_module]
    restart: unless-stopped
    labels:
      - "autoheal=true"
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --peers=false >/dev/null 2>&1 && nslookup one.one.one.one >/dev/null 2>&1"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  app:
    build: ./app
    container_name: tailnet-app
    network_mode: service:ts-tailnet
    depends_on:
      ts-tailnet:
        condition: service_healthy
    env_file:
      # per-tailnet OAuth creds, one pair of vars per tailnets.toml entry —
      # kept in one file, on one service, so there is no compose-level
      # ${VAR} collision between tailnets (see .env.example).
      - .env
    environment:
      TZ: ${TZ:-UTC}
      REFRESH_SECONDS: "300"
    volumes:
      # mounted, not baked in: editing sites should not need an image rebuild
      - ./tailnets.toml:/app/tailnets.toml:ro
      # optional country flags: python3 scripts/fetch-geoip.py fills this (see README)
      - ./data/geo:/app/geo:ro
      # one mount per [[tailnet]] in tailnets.toml; `config` there must match
      - ./config-example-one-tsnet.toml:/app/config-example-one-tsnet.toml:ro
    restart: unless-stopped
    labels:
      - "autoheal=true"
      - "com.centurylinklabs.watchtower.enable=false"
    # the interpreter is "python" on the slim image, not "python3" — getting
    # this wrong makes the container permanently unhealthy, and with autoheal
    # watching it that turns into a restart loop
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=5)\" >/dev/null 2>&1"]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 40s

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: tailnet-autoheal
    restart: unless-stopped
    labels: ["com.centurylinklabs.watchtower.enable=false"]
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "15"
      AUTOHEAL_START_PERIOD: "60"
      DOCKER_SOCK: /var/run/docker.sock
      CURL_TIMEOUT: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
