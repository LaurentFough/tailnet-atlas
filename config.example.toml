# Tailnet Atlas — everything specific to your setup lives here.
# Copy to config.toml and edit. config.toml is gitignored.

# Shown in the browser title and the brand line above the map.
tailnet = "example · tin-otter.ts.net"

# Devices that always count as roaming, whatever address they report.
# Typical case: a cloud VM used as an exit node. It has no LAN that would
# place it anywhere meaningful, and its datacenter address would otherwise
# drag it into whichever bucket happens to match.
pinned_roaming = ["cloud-exit"]

# How devices are placed on the map.
#   "manual" (default) — match each device to a [[site]] below by its PRIVATE
#                        address prefix. Everything after this block applies.
#   "auto"             — derive the sites from each device's PUBLIC address (the
#                        one its traffic leaves through). Devices behind one
#                        uplink are one place, so two homes that both use
#                        192.168.1.x stay two sites. [[site]] blocks become
#                        optional: use them to name or pin a derived site (see
#                        `public` below). `dock` and `mobile` are added for you.
# site_mode = "manual"
#
# auto mode only:
#   Mobile carriers. A cluster with no anchor whose devices are mostly on a mobile
#   network is roaming, however many laptops share the tether. "Mobile network" is
#   judged from the ASN file (scripts/fetch-geoip.py): a name that says mobile /
#   cellular / LTE counts, and so do the ASNs you list. The name check is only a
#   hint — it misses carriers that do not say so ("Vodafone Idea") and can hit
#   non-carriers — so list what you know. `not_mobile_asns` wins over both.
#   LAN ranges that routers ship with and thousands of homes share. Seeing one at
#   two places proves nothing, so a lone server on one is never merged into a
#   site because of it. Defaults: 192.168.0.0/24, .1.0/24, .2.0/24, .8.0/24,
#   .100.0/24, .178.0/24, 10.0.0.0/24, 10.0.1.0/24. List more here.
# common_lans = ["192.168.50.0/24"]
# mobile_asns     = [38266]
# not_mobile_asns = [1766]
#   A cluster becomes a site if it has an anchor (a server, exit node,
#   home-tagged device or subnet router) or at least this many devices that are
#   not phones/tablets. Anything else is roaming. One phone or laptop at a café
#   must not become a site of its own.
# min_site_devices = 2
#   Hotspot / tether ranges. A device on one is roaming: its public address is
#   the carrier's, shared with strangers. (Defaults shown.)
# hotspot_nets = ["172.20.10.", "192.168.43.", "192.168.42."]


# ---------------------------------------------------------------------------
# Sites. One [[site]] block per place. Order matters twice:
#   * `match` rules are tried top to bottom, first hit wins
#   * the order decides the single-column stacking on narrow screens
#
# Two ids are reserved and must exist:
#   dock    — receives whatever is left inside 172.16/12 (container bridges)
#   mobile  — the fallback for anything that matched nothing
#
# `match` is a plain address prefix, not a CIDR — EXCEPT when a value fully
# parses as an address ("192.168.1.42"), in which case it pins that ONE host
# exactly. A partial value ("192.168.1.", "10.0") stays prefix-matched.
# This is automatic, not a flag: the two forms already look different, and
# it matters — prefix-matching "192.168.1.4" would also wrongly claim
# "192.168.1.40" or "192.168.1.245" if some other site pinned those exactly.
# Only put PLACE-BOUND networks/hosts here. A travel router hands out its
# own LAN and carries it everywhere, so that network says nothing about
# where the device is — leave it out and let the uplink decide (see README).
#
# Both `net` (display only) and `match` (actually matched) take either a
# single string or several — a TOML array, or one comma-separated string —
# when one place spans more than one disjoint subnet or host. All of a
# site's values still resolve to that one site id, so this never creates
# ambiguity: a device matches exactly one value, same as with one. See the
# "office" site below.
#
# In site_mode = "auto", a site may carry `public = ["203.0.113.7", "198.51.100.0/24"]`
# instead of `match`: whoever sits behind those addresses (or CIDRs) is that
# site — whatever its size — and takes its label, tint and fx/fy. A site with
# neither is just a name for nothing. `match` still works in auto mode and is
# tried first.
#
# `country = "PT"` (ISO 3166-1 alpha-2) puts that flag beside the site. Without
# it the flag is voted from the countries of its devices' public addresses, which
# needs the optional GeoIP file (python3 scripts/fetch-geoip.py). Docker and
# roaming sites get a whale and a phone instead of a flag.
#
# fx/fy are a starting position in the frame (0..1). They are only a hint: the
# layout pushes overlapping regions apart and keeps them inside the canvas, so
# you do not have to get them exactly right — that logic runs on the site's
# device count, not on how many subnets fed into it.
# tint is "r,g,b" and colours the region's halo, rim and caption.
# ---------------------------------------------------------------------------

[[site]]
id    = "home"
label = "Home"
net   = "192.168.1.0/24"
match = "192.168.1."
fx    = 0.19
fy    = 0.28
tint  = "255,209,102"

# Two buildings on the same badge, wired as separate subnets — still one
# site on the map. Either form works: an array, or "10.20.30., 10.20.31."
[[site]]
id    = "office"
label = "Office"
net   = ["10.20.30.0/24", "10.20.31.0/24"]
match = ["10.20.30.", "10.20.31."]
fx    = 0.54
fy    = 0.11
tint  = "178,139,250"

# A phone hotspot hands out 172.20.10.x, which sits INSIDE 172.16/12 and would
# otherwise be read as a container bridge. Claiming it here, before the
# built-in Docker rule runs, is the whole point of rule order.
[[site]]
id    = "mobile"
label = "Mobile · roaming"
net   = "phones · travel routers"
match = "172.20.10."
fx    = 0.42
fy    = 0.78
tint  = "45,212,191"

[[site]]
id    = "dock"
label = "Docker"
net   = "172.16/12 bridges"
fx    = 0.78
fy    = 0.46
tint  = "91,140,240"
